name: Build Eletroguia (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar o executável
        run: dotnet publish Eletroguia.csproj -c Release -o publish

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Gerar instalador
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Eletroguia.iss
        shell: pwsh

      - name: Publicar instalador como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Eletroguia-Setup
          path: dist\Eletroguia-Setup.exe
          retention-days: 30

      - name: Publicar instalador na branch "artifact" (via git, sem Azure Blob)
        shell: pwsh
        run: |
          git config user.email "build@eletroguia.local"
          git config user.name "Eletroguia Build"
          git checkout --orphan artifact
          git rm -rf . --quiet
          Copy-Item dist\Eletroguia-Setup.exe .
          git add Eletroguia-Setup.exe
          git commit -m "Build $env:GITHUB_RUN_NUMBER"
          git push --force origin artifact
