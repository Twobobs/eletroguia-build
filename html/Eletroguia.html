<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eletroguia® Sistema de Cálculo</title>
<style>
:root{
  --bg:#f3f1ec; --panel:#fffdf8; --ink:#1d2327; --muted:#5d666b; --line:#d9d4c8;
  --brand:#0e5a63; --brand-ink:#ffffff; --accent:#c4561a; --ok:#1f7a3d; --bad:#b3261e; --warn-bg:#fff1d6; --warn-ink:#6b4200;
  --field:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191b; --panel:#1d2326; --ink:#e8e6e0; --muted:#9aa4a8; --line:#323b3f;
    --brand:#3fb1bd; --brand-ink:#08262a; --accent:#f08a4b; --ok:#5fd08a; --bad:#ff8a80; --warn-bg:#3a2e12; --warn-ink:#ffd98a;
    --field:#12171a; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
nav .logo{font-weight:700;font-size:17px;letter-spacing:.2px;padding:4px 10px 14px;color:var(--brand)}
nav .logo small{display:block;font-weight:400;color:var(--muted);font-size:12px;letter-spacing:0}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--ink)}
nav button:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}
nav button[aria-current="page"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding:22px clamp(14px,3vw,34px);max-width:1180px;width:100%}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
.fields{display:grid;gap:10px}
.field{display:grid;grid-template-columns:minmax(0,1fr) 120px 112px;gap:8px;align-items:center}
.field label{color:var(--ink)}
.field .u{color:var(--muted);font-size:13px}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input.num{text-align:right;font-variant-numeric:tabular-nums}
textarea{resize:vertical}
.mono{font-family:ui-monospace,Consolas,"Courier New",monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px;margin-top:6px}
.res{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--field)}
.res .l{color:var(--muted);font-size:12.5px}
.res .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}
.res .u{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.banner{border-radius:10px;padding:10px 12px;margin-bottom:14px;background:var(--warn-bg);color:var(--warn-ink);border:1px solid color-mix(in srgb,var(--warn-ink) 30%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--panel));color:var(--ink);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}
tr.click:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}
tr.sel{background:color-mix(in srgb,var(--brand) 14%,transparent)}
.ok{color:var(--ok)} .bad{color:var(--bad)}
.chg{border-color:var(--brand)!important;background:color-mix(in srgb,var(--brand) 10%,transparent)}
.orig{color:var(--muted);font-size:12px}
.orig code{opacity:.75}
input::placeholder,textarea::placeholder{opacity:.45}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;width:min(560px,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .fields{margin:10px 0 14px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;box-shadow:var(--shadow);z-index:9}
.btn.mini{padding:2px 9px;font-size:12.5px;border-radius:6px}
.btn.cell{min-width:64px;font-variant-numeric:tabular-nums}
input.big{font-size:22px;font-weight:700;color:var(--brand);padding:3px 8px}
svg.slot{width:100%;height:auto;display:block}
svg.slot text{font:12px system-ui,sans-serif;fill:var(--ink)}
.hint{color:var(--muted);font-size:13px}
.vars{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.vars code{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12.5px}
#printArea{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  nav .logo{width:100%;padding:2px 8px 6px}
  .grid2,.split{grid-template-columns:1fr}
  .field{grid-template-columns:1fr 100px 104px}
  .results{grid-template-columns:1fr}
}
@media print{
  body{background:#fff;color:#000}
  .app,.toast,dialog{display:none!important}
  #printArea{display:block;font:13px/1.4 system-ui,sans-serif;color:#000}
  #printArea h1{font-size:20px;margin:0 0 2px}
  #printArea table{margin:8px 0 14px}
  #printArea th,#printArea td{border-bottom:1px solid #999;color:#000}
  #printArea .big{font-size:18px;font-weight:700}
}
/* Aparência clássica e dimensões da janela das referências. */
.app:has(#main.home){width:min(575px,100vw);height:min(420px,100vh)} .app:has(#main.home) nav{display:none}
:root{color-scheme:light;--bg:#c0c0c0;--panel:#efefef;--ink:#111;--muted:#333;--line:#888;--brand:#000080;--brand-ink:#fff;--accent:#800000;--ok:#176b26;--bad:#a00000;--warn-bg:#fff4c5;--warn-ink:#513a00;--field:#fff;--shadow:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#c0c0c0;--panel:#efefef;--ink:#111;--muted:#333;--line:#888;--brand:#000080;--brand-ink:#fff;--field:#fff}}
html,body{margin:0;min-height:100%;background:#137fc0;color:#111;font:11px/1.25 Tahoma,"MS Sans Serif",Arial,sans-serif}
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#12a5e7,#0675c1 48%,#0756a6)}
button,input,select,textarea{font:inherit;color:#111}
.app{display:flex;flex-direction:column;width:min(600px,100vw);height:min(460px,100vh);min-height:360px;margin:auto;background:#efefef;border:2px outset #f7f7f7;box-shadow:1px 1px 0 #555;overflow:hidden}
.titlebar{height:23px;min-height:23px;padding:2px 4px 2px 7px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,#d7e8f7,#9bbce0);border-bottom:1px solid #6688ad;color:#111;font-size:12px}
.window-buttons{display:flex;gap:2px}
.window-buttons button{width:22px;height:17px;line-height:12px;padding:0;border:1px outset #fff;background:#d7d7d7;font:bold 13px Arial,sans-serif}
.window-buttons button:last-child{background:#d7d7d7;color:#111;border-color:#fff}
.window-buttons svg{display:block;width:12px;height:16px;margin:auto}
nav{height:26px;min-height:26px;flex:0 0 26px;padding:1px 5px;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:1px;background:#efefef;border-bottom:1px solid #aaa;overflow-x:auto;overflow-y:hidden}
nav .logo{display:none}
nav button{all:unset;box-sizing:border-box;flex:0 0 78px;width:78px;height:22px;line-height:18px;cursor:pointer;text-align:center;padding:1px 4px;border:1px solid transparent;color:#111;font-size:11px;white-space:nowrap}
nav button:hover{background:#e1eaf5;border-color:#9bb8da}
nav .nav-back{flex-basis:72px;width:72px;margin-right:4px;border-color:#aaa;background:#e7e7e7}
nav button[aria-current="page"]{background:#dbe8f6;border:1px inset #aaa;color:#111;font-weight:400}
main{flex:1;min-height:0;width:100%;max-width:none;margin:0;padding:7px 10px;overflow:auto}
.app-status{height:20px;min-height:20px;border-top:1px solid #fff;box-shadow:inset 0 1px #aaa;padding:3px 7px;text-align:right;background:#efefef;color:#222;font-size:10px}
h1{font-size:13px;color:#a00000;font-weight:bold;margin:0 0 7px 10px}

.sub{display:none}
.card{background:#efefef;border:1px solid #aaa;border-radius:0;padding:7px;box-shadow:none}
.grid2{gap:8px}
.fields{gap:4px}
.field{grid-template-columns:minmax(100px,1fr) minmax(80px,140px) auto;gap:4px;min-height:20px}
.field label{font-size:10.5px}
.field .u{font-size:10px;color:#111;white-space:nowrap}
input,select,textarea{background:#fff;border:1px inset #aaa;border-radius:0;padding:2px 4px;width:100%;min-height:19px}
input.num{text-align:left}
.row{gap:4px;flex-wrap:wrap}
.btn{cursor:pointer;border:2px outset #fff;background:#efefef;padding:3px 8px;border-radius:0;font-size:10.5px;font-weight:400;box-shadow:none}
.btn:hover{border-color:#fff;background:#f6f6f6}
.btn:active{border-style:inset}
.btn.primary{background:#efefef;color:#111;border-color:#fff;font-weight:bold}
.btn.danger{color:#900}
.btn[disabled]{opacity:.5}
.btn.mini{padding:1px 5px;font-size:9px;border-radius:0}
.btn.cell{min-width:48px}
.results{grid-template-columns:repeat(auto-fit,minmax(82px,1fr));gap:4px;margin-top:3px}
.res{border:1px solid #aaa;border-radius:0;padding:4px;background:#fff}
.res .l{font-size:9px;color:#222}
.res .v{font-size:14px;color:#111;font-weight:bold}
.res .u{font-size:9px;color:#222}
.banner{border-radius:0;padding:4px 6px;margin:0 0 5px;background:#fff4c5;color:#513a00;border:1px solid #aa9a62;font-size:10px}
table{border-collapse:collapse;background:#f4f4f4}
th,td{text-align:left;padding:3px 4px;border:1px solid #aaa}
th{font-size:10px;color:#111;font-weight:bold}
tr.click:hover{background:#e6edf7}tr.sel{background:#c6d8f0}
.chg{border-color:#000080!important;background:#dce8f8}
.tag{font-size:9px;padding:1px 4px;border-radius:0}
.split{gap:8px}
dialog{border:2px groove #eee;border-radius:0;background:#efefef;color:#111;padding:10px;width:min(560px,94vw);box-shadow:2px 2px #555}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog .fields{margin:6px 0 8px}
.toast{background:#000080;color:#fff;border:1px solid #fff;padding:6px 10px;border-radius:0;box-shadow:2px 2px #555;font-size:10px}
.btn.mini{padding:1px 4px}
input.big{font-size:15px;color:#111;padding:1px 4px}
.slotImage{display:block;width:100%;height:100%;object-fit:contain}
#main.home{padding:0;overflow:hidden}
.home-layout{height:100%;min-height:0;display:grid;grid-template-columns:122px minmax(0,1fr);background:#030814}
.home-side{position:relative;z-index:2;padding:8px 6px;background:linear-gradient(180deg,#0a1931,#061125);color:#e8faff;border-right:1px solid rgba(0,180,216,.35);display:flex;flex-direction:column;gap:4px}
.home-side h2{color:#7deaff;font:bold 10px Tahoma,Arial,sans-serif;margin:5px 3px 3px;text-transform:uppercase;letter-spacing:.7px}
.home-side .home-link{height:35px;min-height:32px;border:1px solid rgba(0,180,216,.25);background:rgba(10,25,49,.72);color:#e8faff;text-align:left;padding:4px 5px;font-size:10px;cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s}
.home-side .home-link:hover{background:rgba(0,119,182,.38);border-color:#00b4d8;box-shadow:0 0 10px rgba(0,180,216,.25)}
.home-side .home-note{margin-top:auto;padding:6px 4px;background:rgba(10,25,49,.72);color:#9acbd7;font-size:8px;line-height:1.2;border:1px solid rgba(0,180,216,.25)}
.home-art{--home-bg0:#030814;--home-bg1:#0a1931;--home-bg2:#0f274c;--home-primary:#00b4d8;--home-secondary:#0077b6;--home-accent:#4cc9f0;position:relative;isolation:isolate;container-type:inline-size;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(ellipse at center,var(--home-bg2),var(--home-bg1) 52%,var(--home-bg0));color:#fff;display:grid;place-items:center}
.home-wallpaper-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
.home-brand{position:relative;z-index:2;width:min(100%,440px);min-width:0;padding:clamp(8px,3cqw,14px) clamp(6px,3cqw,14px) clamp(10px,4cqw,18px);text-align:center;transition:opacity .3s,transform .3s}
.home-brand>.home-emblem,.home-brand>h1,.home-brand>p,.home-brand>.home-badge{position:relative;z-index:1}
.home-emblem{position:relative;isolation:isolate;display:grid;place-items:center;width:min(150px,40cqw);height:min(150px,40cqw);margin:0 auto clamp(10px,4.5cqw,20px);padding:clamp(8px,3.3cqw,15px);border:2px solid rgba(0,180,216,.82);border-radius:50%;background:rgba(3,8,20,.78);box-shadow:0 0 28px rgba(0,180,216,.35);backdrop-filter:blur(12px)}
.home-emblem-glow{position:absolute;z-index:-1;inset:-10px;border-radius:50%;background:linear-gradient(110deg,#00b4d8,#0077b6,#5844ff);filter:blur(20px);opacity:.68;animation:home-pulse 2.2s ease-in-out infinite alternate}.home-emblem svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 14px rgba(0,180,216,.5))}
.home-emblem{animation:home-emblem-float 3.6s ease-in-out infinite}
.home-emblem svg circle:nth-of-type(1){transform-box:fill-box;transform-origin:center;animation:home-ring-breathe 3s ease-in-out infinite}
.home-emblem svg circle:nth-of-type(2){transform-box:fill-box;transform-origin:center;animation:home-spin 16s linear infinite}
.home-emblem svg circle:nth-of-type(3){transform-box:fill-box;transform-origin:center;animation:home-spin 10s linear infinite reverse}
.home-emblem svg path{transform-box:fill-box;transform-origin:center;animation:home-mark-float 2.8s ease-in-out infinite alternate}

@keyframes home-spin{to{transform:rotate(360deg)}}
@keyframes home-emblem-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes home-ring-breathe{0%,100%{opacity:.75;stroke-width:4}50%{opacity:1;stroke-width:6}}
@keyframes home-mark-float{0%{transform:translateY(1px) rotate(-3deg)}100%{transform:translateY(-2px) rotate(3deg)}}
.home-brand h1{margin:0 0 clamp(6px,2cqw,9px);max-width:100%;color:#f3fdff;font:800 clamp(15px,8.5cqw,44px)/1.02 Arial,sans-serif;letter-spacing:clamp(.2px,.4cqw,2px);text-shadow:0 0 20px rgba(0,180,216,.8),0 0 40px rgba(0,119,182,.5);text-transform:uppercase;white-space:nowrap}
.home-brand h1 span{font-size:.75em;vertical-align:super}
.home-brand p{max-width:100%;margin:0 auto;color:rgba(190,244,255,.9);font-size:clamp(11px,4cqw,19px);line-height:1.35;letter-spacing:clamp(.1px,.08cqw,.35px);text-wrap:balance;overflow-wrap:anywhere}
.home-badge{display:inline-flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(4px,1.8cqw,9px);max-width:100%;box-sizing:border-box;white-space:normal;text-align:center;margin-top:clamp(10px,4.5cqw,20px);padding:clamp(5px,1.6cqw,7px) clamp(8px,3cqw,14px);border:1px solid rgba(0,180,216,.35);border-radius:999px;background:rgba(10,25,49,.45);color:#9beaff;font-size:clamp(9px,2.5cqw,12px);letter-spacing:.3px;backdrop-filter:blur(10px)}
.home-badge:before{content:"";width:7px;height:7px;border-radius:50%;background:#00b4d8;box-shadow:0 0 8px #00b4d8;animation:home-pulse 1.4s ease-in-out infinite alternate}
@keyframes home-pulse{to{opacity:.35;transform:scale(.7)}}
.home-tools{position:absolute;z-index:4;top:8px;right:8px;display:flex;gap:5px}
.home-tool{width:27px;height:25px;padding:0;border:1px solid rgba(0,180,216,.35);border-radius:6px;background:rgba(10,25,49,.72);color:#b8f3ff;cursor:pointer;font-size:14px;backdrop-filter:blur(8px)}
.home-tool:hover,.home-tool[aria-pressed="true"]{background:rgba(0,119,182,.5);border-color:#00b4d8;color:#fff}
@media(max-width:600px){.home-layout{grid-template-columns:108px minmax(0,1fr)}.home-side{padding:6px 4px}.home-side .home-link{font-size:9px;padding:3px}.home-brand{padding:12px 7px}.home-emblem{width:min(128px,34vw);height:min(128px,34vw);padding:12px;margin-bottom:12px}.home-brand h1{font-size:clamp(19px,6vw,32px);letter-spacing:1.2px}.home-badge{margin-top:12px;font-size:8px;padding:4px 7px}}
@media(prefers-reduced-motion:reduce){.home-emblem,.home-emblem-glow,.home-emblem svg circle,.home-emblem svg path,.home-badge:before{animation:none}}
.legacy-tri{display:grid;grid-template-columns:292px minmax(0,1fr);gap:8px;height:100%;align-items:start}
.calc-left,.calc-right{min-width:0}
.stator-frame{height:270px;border:1px solid #999;background:#efefef;padding:0;margin-bottom:3px}
.calc-stamp{display:flex;align-items:center;gap:4px;height:20px;white-space:nowrap;font-size:9px}
.calc-stamp span{display:flex;align-items:center;gap:2px}
.calc-stamp b{font-size:10px}
.calc-stamp input{width:54px;min-height:18px;padding:1px 2px}
.calc-left-actions{display:flex;justify-content:space-around;padding-top:3px;border-top:1px solid #aaa}
.calc-left-actions .btn{min-width:63px}
.calc-right .fields{margin:0}
.calc-right .field{grid-template-columns:minmax(98px,1fr) minmax(75px,100px) auto;gap:3px}
.calc-right .field label{font-size:9.5px}
.calc-actions{margin:5px 0 4px;padding:3px 0;border-top:1px solid #aaa;border-bottom:1px solid #aaa}
.calc-actions .btn{min-width:53px}
.calc-result{padding:5px;margin:0}
.calc-result h2{display:none}
.calc-result .hint{font-size:9px;margin:4px 0}
@media(max-width:600px){.app{width:100vw;height:100vh;min-height:0}.legacy-tri{grid-template-columns:minmax(180px,1fr) minmax(190px,1fr);gap:5px}.stator-frame{height:auto;aspect-ratio:291/273}.calc-stamp{font-size:8px}.calc-stamp input{width:45px}.home-layout{grid-template-columns:110px 1fr}main{padding:6px}}
@media(max-height:500px){body{display:block}.app{height:100vh}}
body:has(.app.is-maximized){display:block}
.app.is-maximized,.app.is-maximized:has(#main.home){width:100vw;height:100vh;min-height:0;max-width:100vw;margin:0;border:0;box-shadow:none}
.app.is-mobile-mode,.app.is-mobile-mode:has(#main.home){width:min(430px,100vw);height:min(900px,100vh);min-height:0;margin:auto}
.app.is-mobile-mode .legacy-tri{grid-template-columns:minmax(0,1fr);height:auto;gap:7px}
.app.is-mobile-mode .stator-frame{height:auto;aspect-ratio:291/273}
.app.is-mobile-mode .calc-left-actions{justify-content:flex-start;gap:6px}
.app.is-mobile-mode .calc-right .field{grid-template-columns:minmax(95px,1fr) minmax(76px,100px) auto}
.app.is-mobile-mode .split,.app.is-mobile-mode .grid2{grid-template-columns:minmax(0,1fr)}
.app.is-mobile-mode main{padding:6px;overflow:auto}
.app.is-mobile-mode .home-layout{grid-template-columns:108px minmax(0,1fr)}
.app.is-mobile-mode #mobileModeToggle{background:#cbdced;border-style:inset}
@media(max-width:430px){.app.is-mobile-mode,.app.is-mobile-mode:has(#main.home){width:100vw;height:100vh}}

/* Liquid glass aplicado ao app inteiro; a animação da Home permanece no canvas. */

.tag{border-color:rgba(129,214,240,.32);background:rgba(10,37,61,.48);color:#bfeeff}
.banner{background:rgba(110,77,18,.34);border-color:rgba(255,211,111,.32);color:#ffe7b0}
.banner.ok{background:rgba(35,121,79,.25);border-color:rgba(104,220,158,.32);color:#d9ffea}

.results .res{background:linear-gradient(145deg,rgba(18,43,68,.85),rgba(6,19,37,.84))}
.res .v{color:#77e6ff;text-shadow:0 0 12px rgba(0,180,216,.18)}

.home-tool:focus-visible,.btn:focus-visible,nav button:focus-visible{outline:2px solid #62e3ff;outline-offset:2px}

.field .u,.res .l,.res .u,.orig{color:var(--muted)}

.calc-left-actions,.calc-actions{border-color:rgba(145,211,240,.2)}

/* ====================== tela Calcular ====================== */
function readInputs(){
  const vals={}, bad=[];
  INPUTS.forEach(i=>{ const raw=$("#in_"+i.k).value; const n=parseNum(raw); if(!(n>0)) bad.push(i); vals[i.k]=n; });
  return {vals,bad};
}
function viewCalc(m){
  m.append(h("h1",{},"Cálculo de Motor Trifásico"));
  const unvalidated=!examplesStatus().esp;
  if(unvalidated) m.append(h("div",{class:"banner",role:"alert"},"A regra do número de espiras ainda não foi validada. Confira em Fórmulas."));
  const fields=INPUTS.map(i=>{
    const inp=h("input",{id:"in_"+i.k,class:"num",inputmode:"decimal",autocomplete:"off","aria-label":i.l,
      value:S.inputs[i.k]!=null?String(S.inputs[i.k]).replace(".",","):"",
      onkeydown:e=>{ if(e.key==="Enter"){ e.preventDefault(); doCalc(); } }});
    const unit=h("span",{class:"u"},i.u);
    if(db.tables[i.k]) unit.append(" ",h("button",{class:"btn mini",type:"button",title:"Escolher na tabela de apoio","aria-label":"Escolher "+i.l+" na tabela",onclick:()=>openTable(i.k)},"…"));
    return h("div",{class:"field"},h("label",{for:"in_"+i.k},i.l),inp,unit);
  });
  const resBox=h("div",{id:"resBox"});
  const c=S.loaded?db.calcs.find(x=>x.cod===S.loaded):null;
  const date=c?new Date(c.data):null;
  const stamp=h("div",{class:"calc-stamp",id:"calcStamp"},
    h("span",{},h("b",{},"Data:"),h("input",{readonly:true,value:date?date.toLocaleDateString("pt-BR"):"00/00/0000"})),
    h("span",{},h("b",{},"Hora:"),h("input",{readonly:true,value:date?date.toLocaleTimeString("pt-BR"):"00:00:00"})),
    h("span",{},h("b",{},"Cálculo:"),h("input",{readonly:true,value:c?String(c.cod).padStart(3,"0"):"000"})));
  const left=h("section",{class:"calc-left"},
    h("div",{class:"stator-frame"},slotSvg()),stamp,
    h("div",{class:"calc-left-actions"},
      h("button",{class:"btn",onclick:goBack},"Voltar"),
      h("button",{class:"btn",id:"btnPrint",disabled:true,onclick:()=>printCalc(S.last)},"Imprimir"),
      h("button",{class:"btn",id:"btnSave",disabled:true,onclick:openSaveDialog},"Gravar")));
  const right=h("section",{class:"calc-right"},
    h("div",{class:"fields"},...fields),
    h("div",{class:"row calc-actions"},
      h("button",{class:"btn primary",onclick:doCalc},"Calcular"),
      h("button",{class:"btn",id:"btnRecalc",disabled:true,title:"Recalcula a seção do fio e a potência com o nº de espiras digitado",onclick:doRecalc},"Re-calcula"),
      h("button",{class:"btn",onclick:()=>{S.inputs={};S.loaded=null;S.last=null;render();}},"Limpar")),
    h("div",{class:"card calc-result"},h("h2",{},"Resultado"),resBox));
  m.append(h("div",{class:"legacy-tri"},left,right));
  if(S.last&&S.last.fromView) showResult(S.last); else resBox.append(h("p",{class:"hint"},"Preencha os dados e toque em Calcular."));
}
function refreshCalcStamp(){
  const box=$("#calcStamp"); if(!box) return;
  const rec=S.loaded?db.calcs.find(x=>x.cod===S.loaded):null;
  const when=S.last&&S.last.at?new Date(S.last.at):(rec?new Date(rec.data):null);
  const inputs=box.querySelectorAll("input");
  if(inputs[0]) inputs[0].value=when?when.toLocaleDateString("pt-BR"):"00/00/0000";
  if(inputs[1]) inputs[1].value=when?when.toLocaleTimeString("pt-BR"):"00:00:00";
  if(inputs[2]) inputs[2].value=String(rec?rec.cod:(S.last?db.nextCalc:0)).padStart(3,"0");
}
function doCalc(){
  const {vals,bad}=readInputs(); S.inputs=vals;
  if(bad.length){ toast("Preencha com valores maiores que zero: "+bad.map(b=>b.l).join(", ")); const first=$("#in_"+bad[0].k); first&&first.focus(); return; }
  const r=runCalc(vals); S.loaded=null; S.last={inputs:vals,out:r.out,err:r.err,fromView:true,at:new Date().toISOString()}; showResult(S.last);
}
/* Recalcular: usa o nº de espiras digitado (ex.: arredondado para um inteiro) e refaz seção e potência */
function doRecalc(){
  const {vals,bad}=readInputs(); S.inputs=vals;
  if(bad.length){ toast("Preencha todas as medidas antes de recalcular."); return; }
  const esp=parseNum($("#res_esp").value);
  if(!(esp>0)){ toast("Digite o número de espiras por ranhura."); $("#res_esp").focus(); return; }
  const r=runCalc(vals,null,{esp}); S.loaded=null; S.last={inputs:vals,out:r.out,err:r.err,fromView:true,at:new Date().toISOString()}; showResult(S.last);
}
function showResult(r){
  refreshCalcStamp();
  const box=$("#resBox"); if(!box) return; box.replaceChildren();
  const cards=shown().map(f=>{
    if(f.k==="esp") return h("div",{class:"res"},h("label",{class:"l",for:"res_esp"},f.label),
      h("input",{id:"res_esp",class:"num big",inputmode:"decimal",value:fmtRes(f,r.out[f.k]),
        onkeydown:e=>{ if(e.key==="Enter"){ e.preventDefault(); doRecalc(); } }}));
    return h("div",{class:"res"},h("div",{class:"l"},f.label),
      h("div",{class:"v"},fmtRes(f,r.out[f.k]),f.unit?h("span",{class:"u"},f.unit):null));
  });
  box.append(h("div",{class:"results"},cards),
    h("p",{class:"hint"},"Para fechar em um número inteiro de espiras, digite-o no primeiro campo e toque em Recalcular."));
  Object.entries(r.err).forEach(([k,msg])=>box.append(h("p",{class:"bad"},"Erro na fórmula de "+k+": "+msg)));
  const ok=Object.keys(r.err).length===0;
  $("#btnSave").disabled=!ok; $("#btnPrint").disabled=!ok; $("#btnRecalc").disabled=!ok;
  if(S.loaded) box.append(h("p",{class:"hint"},"Aberto do arquivo: cálculo nº "+S.loaded+". Gravar cria um novo cálculo."));
}
/* tabelas de apoio: escolher indução, densidade ou cos φ × rendimento por potência e polos */
function openTable(key){
  const t=db.tables[key], d=$("#dlg");
  d.replaceChildren(h("h2",{},"Tabela: "+t.title+(t.unit?" ("+t.unit+")":"")),
    h("div",{class:"hint"},"Escolha pela potência do motor (CV) e pelo número de polos. Você pode editar esta tabela na aba Fórmulas."),
    h("div",{style:"overflow:auto;margin-top:8px"},h("table",{},
      h("thead",{},h("tr",{},h("th",{},"Potência (CV)"),...t.cols.map(c=>h("th",{class:"n"},c+" polos")))),
      h("tbody",{},...t.rows.map((rl,ri)=>h("tr",{},h("td",{},rl),...t.cols.map((c,ci)=>{
        const v=t.vals[ri][ci];
        return h("td",{class:"n"},h("button",{class:"btn mini cell",onclick:()=>{ $("#in_"+t.target).value=String(v).replace(".",","); d.close(); $("#in_"+t.target).focus(); }},String(v).replace(".",",")));
      })))))),
    h("div",{class:"row",style:"justify-content:flex-end;margin-top:12px"},h("button",{class:"btn",onclick:()=>d.close()},"Fechar")));
  d.showModal();
}
function openSaveDialog(){

/* ====================== Monofásico ====================== */
/* Cálculo reproduzido do programa original (rotinas do Efetivo e do Auxiliar): os valores digitados viram Currency
   (inteiro × 10000), as contas usam precisão estendida de 64 bits, as conversões arredondam para o par mais próximo
   e cada grupo de espiras é truncado. Aqui isso é feito com frações exatas (BigInt), sem erro de ponto flutuante. */
const Q=(()=>{
  const gcd=(a,b)=>{ a=a<0n?-a:a; while(b){ [a,b]=[b,a%b]; } return a; };
  const mk=(n,d=1n)=>{ if(d<0n){ n=-n; d=-d; } const g=gcd(n,d)||1n; return {n:n/g,d:d/g}; };
  const len=x=>x.toString(2).length;
  const mul=(a,b)=>mk(a.n*b.n,a.d*b.d), div=(a,b)=>mk(a.n*b.d,a.d*b.n), add=(a,b)=>mk(a.n*b.d+b.n*a.d,a.d*b.d), sub=(a,b)=>mk(a.n*b.d-b.n*a.d,a.d*b.d);
  /* arredonda para 64 bits de mantissa, como o x87 faz depois de cada operação */
  function ext(q){
    if(q.n===0n) return q;
    const neg=q.n<0n, n=neg?-q.n:q.n, d=q.d;
    let e=len(n)-len(d)-64;
    const sc=e=>e>=0?[n,d<<BigInt(e)]:[n<<BigInt(-e),d];
    for(;;){ const [N,D]=sc(e); if(N>=(D<<64n)) e++; else if(N<(D<<63n)) e--; else break; }
    const [N,D]=sc(e); let m=N/D; const r2=(N%D)*2n; if(r2>D||(r2===D&&m%2n===1n)) m++;
    const r=e>=0?mk(m<<BigInt(e),1n):mk(m,1n<<BigInt(-e));
    return neg?mk(-r.n,r.d):r;
  }
  const rnd=q=>{ let f=q.n/q.d; if(q.n<0n&&q.n%q.d!==0n) f-=1n; const r2=(q.n-f*q.d)*2n; return (r2>q.d||(r2===q.d&&f%2n!==0n))?f+1n:f; };
  const trunc=q=>q.n/q.d;
  const tbyte=hex=>{ const b=hex.match(/../g).map(x=>BigInt("0x"+x)); let m=0n; for(let i=7;i>=0;i--) m=(m<<8n)|b[i]; const e=Number(((b[9]&0x7fn)<<8n)|b[8])-16383-63;
    return e>=0?mk(m<<BigInt(e),1n):mk(m,1n<<BigInt(-e)); };
  return {mk,mul:(a,b)=>ext(mul(a,b)),div:(a,b)=>ext(div(a,b)),add:(a,b)=>ext(add(a,b)),sub:(a,b)=>ext(sub(a,b)),rnd,trunc,tbyte,int:x=>mk(BigInt(x))};
})();
const MONO = {
  pi:Q.tbyte("bc74931804560ec90040"), k128:Q.tbyte("3bdf4f8d976e1283fc3f"), k736:Q.tbyte("e5d022dbf97e6abcfe3f"), k56:Q.tbyte("295c8fc2f5285c8ffe3f"),
  ranhuras: {2:[18,24], 4:[24,32,36,48]},
  densidade: [["Até ½ CV",7],["½ a 1 CV",6],["1 a 2 CV",5.5],["Mais de 2 CV",5]],
  /* divisão das espiras por grupo, em 1/10000, igual para Efetivo e Auxiliar */
  pct: {"1:6":[10000],"1:4:6":[4400,5600],"1:6:8":[4500,5500],"1:4:6:8":[2500,3500,4000],"1:5:7:9":[2500,3500,4000],"1:6:8:10":[2700,3500,3800],
        "1:3:5:7:9":[1200,2200,3000,3600],"1:10:12":[4400,5600],"1:8:10:12":[2500,3500,4000],"1:6:8:10:12":[1800,2500,2700,3000],"1:4:6:8:10:12":[1000,1500,2000,2500,3000]},

/* ===== Trifásico exato (rotina Calcular do PMotor.exe) =====
   Campos: comprimento e jugo e largDente viram Currency e são divididos por 10 (arredondando); os demais ficam em Currency.
   w: se largDente*(passo-1)/(2*jugo) > 1,2 vale o limite do jugo, senão o dos dentes. */
const TRI={k12:Q.tbyte("9a99999999999999ff3f"),k045:Q.tbyte("66666666666666e6fd3f"),k1732:Q.tbyte("931804560e2db2ddff3f"),k1e12:Q.tbyte("0000000010a5d4e82640")};
const numCurr=n=>Q.rnd(Q.mul(Q.mk(BigInt(Math.round(n*1e6)),1000000n),Q.int(10000)));
function triCalc(v,espDigitada){
  const I=Q.int, d10=x=>Q.rnd(Q.div(I(numCurr(x)),I(10)));
  const c54=d10(v.comprimento), c64=d10(v.jugo), c5c=d10(v.largDente);
  const c6c=numCurr(v.largRan), c74=numCurr(v.altRan), c7c=numCurr(v.passo), c84=numCurr(v.inducao), c8c=numCurr(v.tensao), c94=numCurr(v.nRanhuras), c9c=numCurr(v.densidade), ca4=numCurr(v.cosfi);
  const t1=Q.mul(Q.mul(I(c54),I(c5c)),I(c7c-10000n)), t2=Q.mul(Q.mul(I(c64),I(c54)),I(2));
  if(t2.n===0n) throw new Error("jugo ou comprimento zerado");
  const X=Q.rnd(Q.div(t1,t2));
  const w = X>12000n ? Q.rnd(Q.div(Q.mul(t2,TRI.k12),I(10000))) : Q.rnd(Q.div(t1,I(10n**8n)));
  const den=Q.mul(Q.mul(I(w),I(c84)),Q.div(I(c94),I(3)));
  if(den.n===0n) throw new Error("fator de fluxo zerado");
  let esp=Q.rnd(Q.mul(Q.div(Q.mul(I(750000),I(c8c)),den),TRI.k1e12));
  if(espDigitada!=null) esp=numCurr(espDigitada);
  if(esp===0n) throw new Error("espiras zeradas");
  const sec=Q.rnd(Q.div(Q.mul(Q.mul(I(c6c),I(c74)),TRI.k045),I(esp)));
  let p=Q.mul(TRI.k1732,I(c9c)); p=Q.mul(p,I(sec)); p=Q.mul(p,TRI.k1732); p=Q.mul(p,I(c8c)); p=Q.mul(p,I(ca4));
  const pot=Q.rnd(Q.div(Q.div(p,I(736)),TRI.k1e12));
  const f=x=>Number(x)/10000;
  return {w:f(w),esp:f(esp),sec:f(sec),pot:f(pot)};
}
/* texto → Currency (inteiro × 10000); aceita vírgula ou ponto */
function monoCurr(s){
  const t=String(s).trim().replace(",","."); if(!/^\d+(\.\d+)?$/.test(t)) return null;
  const [i,f=""]=t.split("."); return Q.rnd(Q.mul(Q.mk(BigInt(i+f),10n**BigInt(f.length)),Q.int(10000)));
}
function currStr(v){ const neg=v<0n; v=neg?-v:v; const i=v/10000n, f=v%10000n; let t=String(i); if(f) t+=","+String(f).padStart(4,"0").replace(/0+$/,""); return (neg?"-":"")+t; }
/* v: pot, tensao, corrente, comprimento, diametro, densidade, passoEf, passoAu (textos ou números).
   cliques: quantas vezes o Calcular do Auxiliar foi apertado (o original grava o resultado de volta na potência, então muda a cada clique). */
function monoCalc(v,cliques=1){
  const c={}; for(const k of ["pot","tensao","corrente","comprimento","diametro","densidade"]){ c[k]=monoCurr(v[k]); if(c[k]===null||c[k]<=0n&&k!=="pot") return {erro:"valor inválido em "+k}; }
  const A=Q.rnd(Q.div(Q.int(c.comprimento),Q.int(10))), B=Q.rnd(Q.div(Q.int(c.diametro),Q.int(10)));
  const X1=Q.rnd(Q.div(Q.mul(MONO.pi,Q.int(B)),Q.int(4)));
  const X2=Q.rnd(Q.div(Q.div(Q.mul(Q.mul(Q.int(5),Q.int(X1)),Q.int(A)),Q.int(1000)),Q.int(10000)));
  if(X2===0n) return {erro:"comprimento ou diâmetro pequeno demais"};
  const V=Q.int(c.tensao);
  const R=Q.rnd(Q.mul(Q.div(Q.mul(MONO.k128,V),Q.int(X2)),Q.int(10000)));
  const grupos=(tot,passo)=>{ const p=MONO.pct[passo]; if(!p) return null; const o=[]; for(let i=0;i<5;i++) o.push(Number(i<p.length?Q.trunc(Q.div(Q.mul(Q.int(tot),Q.int(p[i])),Q.int(10n**8n))):0n)); return o; };
  let P=c.pot;
  for(let i=0;i<cliques;i++){
    const Pq=Q.int(P);
    P = P<10000n ? Q.rnd(Q.add(Q.mul(MONO.k736,Pq),Q.int(10000))) : Q.rnd(Q.add(Q.div(Q.sub(Pq,Q.mul(MONO.k736,Pq)),Q.int(3)),Q.int(10000)));
  }
  const Ra=Q.rnd(Q.div(Q.div(Q.mul(Q.mul(Q.int(R),Q.int(P)),Q.div(V,Q.int(2))),V),Q.int(10000)));
  const razao=Q.div(Q.int(c.corrente),Q.int(c.densidade));
  return {R:Number(R), Ra:Number(Ra), ef:grupos(R,v.passoEf), au:grupos(Ra,v.passoAu),
          fioEf:currStr(Q.rnd(Q.mul(razao,Q.int(10000)))), fioAu:currStr(Q.rnd(Q.mul(Q.mul(razao,MONO.k56),Q.int(10000))))};
}

        h("button",{class:"btn primary",onclick:()=>{ S.mono={pot:i.pot,tensao:i.tensao,corrente:i.corrente,polos:i.polos,comprimento:i.comprimento,diametro:i.diametro,densidade:i.densidade,nRanhuras:i.nRanhuras,passoEf:i.passoEf,passoAu:i.passoAu}; go("mono"); }},"Abrir no cálculo"),
        h("button",{class:"btn",onclick:()=>printMono(c)},"Imprimir"),
        h("button",{class:"btn danger",onclick:()=>ask("Excluir cálculo nº "+c.cod+"?","Não dá para desfazer. Faça um backup antes se tiver dúvida.","Excluir",()=>{db.monoCalcs=db.monoCalcs.filter(x=>x.cod!==c.cod);S.selMono=null;save();fill();toast("Cálculo excluído.");},true)}, "Excluir")));
  }
  fill();
}

render();
</script>
</body>
</html>
